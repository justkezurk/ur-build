     DAW is present, else renders standalone. Uses shared `audioContext`; taps
     WarpReactor's visualizer if loaded.

  var ctx = null, master = null, audioBuilt = false, gateOn = false, sustain = false;
  var lfoNodes = [];
  var rafId = 0;

  function unlock() { if (ctx && ctx.state === "suspended") ctx.resume(); }
  function getCtx() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }
  function ensureAudio() {
    if (audioBuilt) return;
    ctx = getCtx();
    master = ctx.createGain(); master.gain.value = 0.85;
    var comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    audioBuilt = true;
  }

  function makeNoise(len) {
    var b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * len), ctx.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  var noiseBuf = null;
  function getNoise() { if (!noiseBuf) noiseBuf = makeNoise(2.0); return noiseBuf; }

  function trigger(name, when, opts) {
    ensureAudio();
    unlock();
    var p = params[name] || {level:0.8, decay:0.3, pitch:0, tone:0.5};
    var v = KIT.find(function(x){return x.name===name;});
    if (!v) return;
    var t = (when||0) + ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    var f = ctx.createBiquadFilter();
    var sh = ctx.createWaveShaper();
    var n = ctx.createBufferSource();
    n.buffer = getNoise();

    var cat = v.cat || "perc";
    var baseF = (cat === "bass") ? 55 : 180;
    o.type = (cat === "bass") ? "sine" : "square";
    o.frequency.value = baseF * Math.pow(2, (p.pitch||0)/12);

    f.type = "lowpass";
    f.frequency.value = (cat === "bass") ? 800 : 2400;
    f.Q.value = (p.tone||0.5) * 8;

    sh.curve = makeCurve(0.2, 0.1);

    var dur = Math.max(0.05, (p.decay||0.3) * (cat === "bass" ? 1.6 : 1.0));
    g.gain.value = (p.level||0.8) * 0.9;
    g.gain.setTargetAtTime(0.0001, t + dur * 0.7, dur * 0.25);

    var filtEnv = ctx.createGain();
    filtEnv.gain.value = 1;
    filtEnv.gain.setTargetAtTime(0.3, t + dur * 0.4, dur * 0.4);

    n.connect(filtEnv); filtEnv.connect(f.frequency);
    o.connect(sh); sh.connect(f); f.connect(g); g.connect(master);
    n.start(t); o.start(t);
    o.stop(t + dur + 0.1); n.stop(t + dur + 0.1);

    // visual hit feedback if pads exist
    try {
      var pad = document.querySelector(".dm-pad[data-voice='"+name+"']");
      if (pad) { pad.classList.add("hit"); setTimeout(function(){ pad.classList.remove("hit"); }, 180); }
    } catch(e){}
  }

  function makeCurve(drive, fold) {
    var n = 2048, c = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var x = (i / (n-1)) * 2 - 1;
      var y = x * (1 + drive * 6);
      if (fold > 0) y = Math.sin(y * (1 + fold * 5));
      c[i] = Math.tanh(y);
    }
    return c;
  }

  /* ---- Sequencer ---- */
  function startSeq() {
    if (seq.running) return;
    seq.running = true;
    seq.current = 0;
    tick();
  }
  function stopSeq() {
    seq.running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  }
  function tick() {
    if (!seq.running) return;
    var step = seq.current;
    var swing = seq.swing || 0;
    var delay = (step % 2 === 1) ? swing * 0.08 : 0;
    KIT.forEach(function(v) {
      if (seq.mute[v.name]) return;
      if (seq.solo[v.name] && !Object.values(seq.solo).some(Boolean)) return;
      if (seq.pattern[v.name] && seq.pattern[v.name][step]) {
        var vel = (seq.vel[v.name] && seq.vel[v.name][step]) || 0.8;
        var rate = (seq.rate[v.name] && seq.rate[v.name][step]) || 1;
        trigger(v.name, delay, {vel:vel, rate:rate});
        // visual
        try {
          var row = document.querySelector(".dm-row[data-voice='"+v.name+"']");
          if (row) { row.classList.add("hit"); setTimeout(function(){ row.classList.remove("hit"); }, 120); }
        } catch(e){}
      }
    });
    seq.current = (seq.current + 1) % seq.steps;
    var bpmNow = (typeof window.globalBPM === "number" && window.globalBPM > 40) ? window.globalBPM : 120;
    var stepTime = (60 / bpmNow) * (4 / seq.steps) * 1000;
    rafId = setTimeout(tick, stepTime);
  }

  function initPattern() {
    KIT.forEach(function(v) {
      if (!seq.pattern[v.name]) seq.pattern[v.name] = new Array(seq.steps).fill(false);
      if (!seq.vel[v.name]) seq.vel[v.name] = new Array(seq.steps).fill(0.8);
      if (!seq.pitch[v.name]) seq.pitch[v.name] = new Array(seq.steps).fill(0);
      if (!seq.rate[v.name]) seq.rate[v.name] = new Array(seq.steps).fill(1);
    });
  }

      b.className = "dm-pad " + (v.cat === "bass" ? "bass" : (v.cat === "perc" ? "perc" : ""));
      b.setAttribute("data-voice", v.name);
      b.innerHTML = v.name.toUpperCase() + "<small>" + v.key + "</small>";
      b.addEventListener("click", function() { trigger(v.name); });
      pads.appendChild(b);
    });

    // build sequencer rows
    var seqEl = pane.querySelector("#dm-seq");
    seqEl.style.setProperty("--steps", seq.steps);
    KIT.forEach(function(v) {
      var row = document.createElement("div");
      row.className = "dm-row dm-rowgroup cat-" + v.cat;
      row.setAttribute("data-voice", v.name);
      row.innerHTML =

          '<button class="dm-ms m" data-act="mute" data-voice="' + v.name + '">M</button>' +
          '<button class="dm-ms s" data-act="solo" data-voice="' + v.name + '">S</button>' +

        k.setAttribute("data-min", pr.min != null ? pr.min : (pr.k === "pitch" ? -12 : 0));
        k.setAttribute("data-max", pr.max != null ? pr.max : (pr.k === "pitch" ? 12 : 1));
        k.setAttribute("data-step", pr.step != null ? pr.step : 0.01);
        k.setAttribute("data-dec", pr.dec != null ? pr.dec : 2);

        k.setAttribute("data-def", pr.def != null ? pr.def : params[v.name][pr.k]);

  function renderCells() {
    var seqEl = pane.querySelector("#dm-seq");
    if (!seqEl) return;
    seqEl.querySelectorAll(".dm-cells").forEach(function(host) {
      host.innerHTML = "";
      host.style.setProperty("--steps", seq.steps);
      var voice = host.getAttribute("data-voice");
      for (var i = 0; i < seq.steps; i++) {
        var c = document.createElement("div");
        c.className = "dm-cell" + (i % 4 === 0 ? " beat" : "");
        c.setAttribute("data-step", i);
        c.setAttribute("data-voice", voice);
        if (seq.pattern[voice] && seq.pattern[voice][i]) c.classList.add("on");
        host.appendChild(c);
      }
    });
  }

  function cycleCell(cell) {
    var voice = cell.getAttribute("data-voice");
    var step = parseInt(cell.getAttribute("data-step"), 10);
    if (!seq.pattern[voice]) seq.pattern[voice] = new Array(seq.steps).fill(false);
    var cur = seq.pattern[voice][step] ? 1 : 0;
    var next = (cur + 1) % 3; // off -> x1 -> x2 -> off (simple ratchet simulation)
    seq.pattern[voice][step] = next > 0;
    if (next === 2) {
      // ratchet visual
      cell.classList.add("ratchet");
      cell.innerHTML = '<div class="dm-seg2"></div><div class="dm-seg2"></div>';
    } else {
      cell.classList.remove("ratchet");
      cell.innerHTML = "";
      cell.classList.toggle("on", next > 0);
    }
    return next;
  }

  function clearCell(cell) {
    var voice = cell.getAttribute("data-voice");
    var step = parseInt(cell.getAttribute("data-step"), 10);
    if (seq.pattern[voice]) seq.pattern[voice][step] = false;
    cell.classList.remove("on", "ratchet");
    cell.innerHTML = "";
  }

  function renderVel() { /* velocity bars if needed later */ }
  function renderPitch() { /* pitch lanes if needed later */ }

  function wireSeq() {
    var seqEl = pane.querySelector("#dm-seq");
    if (!seqEl) return;

    // voice button audition
    seqEl.querySelectorAll(".dm-vbtn").forEach(function(btn) {
      var voice = btn.getAttribute("data-voice");
      btn.addEventListener("click", function() { trigger(voice); });
    });

    // mute/solo/menu
    seqEl.addEventListener("click", function(e) {
      var btn = e.target.closest(".dm-ms, .dm-ham");
      if (!btn) return;
      var voice = btn.getAttribute("data-voice");
      var act = btn.getAttribute("data-act");
      if (act === "mute") { seq.mute[voice] = !seq.mute[voice]; btn.classList.toggle("on", seq.mute[voice]); }
      else if (act === "solo") { seq.solo[voice] = !seq.solo[voice]; btn.classList.toggle("on", seq.solo[voice]); }
      else if (act === "menu") {
        var grp = btn.closest(".dm-rowgroup"), dr = grp.querySelector(".dm-drawer");
        var opening = dr.hasAttribute("hidden");
        seqEl.querySelectorAll(".dm-drawer:not([hidden])").forEach(function(o) { if (o !== dr) o.setAttribute("hidden", ""); });
        seqEl.querySelectorAll(".dm-ham.on").forEach(function(h) { if (h !== btn) h.classList.remove("on"); });
        if (opening) dr.removeAttribute("hidden"); else dr.setAttribute("hidden", "");
        btn.classList.toggle("on", opening);
      }
    });

    // cell interaction
    var lpCell = null, lpX = 0, lpY = 0, lpMoved = false, lpFired = false, lpTimer = null;
    function lpClear() { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } }
    seqEl.addEventListener("pointerdown", function(e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      var cell = e.target.closest(".dm-cell"); if (!cell) return;
      lpCell = cell; lpX = e.clientX; lpY = e.clientY; lpMoved = false; lpFired = false;
      lpTimer = setTimeout(function() { lpFired = true; clearCell(cell); }, 380);
    });
    seqEl.addEventListener("pointermove", function(e) {
      if (!lpCell) return;
      if (Math.abs(e.clientX - lpX) + Math.abs(e.clientY - lpY) > 8) { lpMoved = true; lpClear(); }
    });
    seqEl.addEventListener("pointerup", function() {
      if (!lpCell) return;
      lpClear(); var cell = lpCell; lpCell = null;
      if (lpFired || lpMoved) return;
      var val = cycleCell(cell);
      if (val > 0) { trigger(cell.getAttribute("data-voice")); }
    });
    seqEl.addEventListener("pointercancel", function() { lpClear(); lpCell = null; });
    seqEl.addEventListener("contextmenu", function(e) {
      var cell = e.target.closest(".dm-cell"); if (!cell) return;
      e.preventDefault(); lpClear(); lpCell = null; clearCell(cell);
    });

    // transport
    var playBtn = pane.querySelector("#dm-play");
    playBtn.addEventListener("click", function() {
      if (seq.running) { stopSeq(); playBtn.classList.remove("on"); playBtn.innerHTML = "&#9654; PLAY"; }
      else { startSeq(); playBtn.classList.add("on"); playBtn.innerHTML = "&#9632; STOP"; }
    });

    pane.querySelector("#dm-steps").addEventListener("click", function(e) {
      var b = e.target.closest("button"); if (!b) return;
      seq.steps = +b.dataset.n;
      this.querySelectorAll("button").forEach(function(x) { x.classList.toggle("on", x === b); });
      initPattern(); renderCells(); renderVel(); renderPitch(); seq.current = 0;
    });

    pane.querySelector("#dm-clear").addEventListener("click", function() {
      KIT.forEach(function(v) { for (var i = 0; i < seq.steps; i++) seq.pattern[v.name][i] = false; });
      renderCells();
    });

    var bpmin = pane.querySelector("#dm-bpmin");
    if (bpmin) bpmin.addEventListener("input", function(e) { window.globalBPM = Number(e.target.value) || 120; });

    function volBind(val) { unlock(); if (master) master.gain.setTargetAtTime(val, ctx.currentTime, 0.02); }
    bindRange(pane, "dm-vol", volBind, 2, "");

    var sw = pane.querySelector("#dm-swing"), swv = pane.querySelector("#dm-swingv");
    if (sw) sw.addEventListener("input", function(e) { seq.swing = Number(e.target.value); if (swv) swv.textContent = Math.round(seq.swing * 100) + "%"; });

    // Capture / snapshots
    var NS = "dm-snap";
    var capBtn = pane.querySelector("#dm-capbtn"), capPanel = pane.querySelector("#dm-cap"), fileIn = pane.querySelector("#dm-file");
    function dlPattern() {
      var blob = new Blob([JSON.stringify(api.getPattern(), null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = "drum-pattern.sfts2026.json"; a.click();
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }
    function nowName() { var d = new Date(); function p(n) { return (n < 10 ? "0" : "") + n; } return "Pat " + p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); }
    function listSlots() { return URStore.list(NS).filter(function(k) { return k.indexOf("s_") === 0; }).map(function(k) { var v = URStore.get(NS, k) || {}; return { id: k, name: v.name || k, ts: v.ts || 0 }; }).sort(function(a, b) { return b.ts - a.ts; }); }
    function renderSlots() {
      var host = pane.querySelector("#dm-cap-slots"); if (!host) return;
      var slots = listSlots(); host.innerHTML = "";
      if (!slots.length) { host.innerHTML = '<div class="dm-empty">No snapshots yet.</div>'; return; }
      slots.forEach(function(s) {
        var row = document.createElement("div"); row.className = "dm-slot";
        var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = s.name; nm.title = "load";
        nm.addEventListener("click", function() { var v = URStore.get(NS, s.id); if (v && v.pattern) { api.loadPattern(v.pattern); } });
        var ren = document.createElement("button"); ren.className = "dm-ic"; ren.textContent = "\u270E";
        ren.addEventListener("click", function() { var nn = prompt("Rename snapshot", s.name); if (nn) { var v = URStore.get(NS, s.id) || {}; v.name = nn; URStore.set(NS, s.id, v); renderSlots(); } });
        var del = document.createElement("button"); del.className = "dm-ic"; del.textContent = "\u2715";
        del.addEventListener("click", function() { URStore.del(NS, s.id); renderSlots(); });
        row.appendChild(nm); row.appendChild(ren); row.appendChild(del); host.appendChild(row);
      });
    }
    if (capBtn) capBtn.addEventListener("click", function(e) { e.stopPropagation(); var open = capPanel.classList.toggle("open"); if (open) renderSlots(); });
    document.addEventListener("click", function(e) { if (capPanel && capPanel.classList.contains("open") && !capPanel.contains(e.target) && e.target !== capBtn) capPanel.classList.remove("open"); });
    var nb = pane.querySelector("#dm-cap-new"); if (nb) nb.addEventListener("click", function() { URStore.set(NS, "s_" + Date.now(), { name: nowName(), ts: Date.now(), pattern: api.getPattern() }); renderSlots(); });
    var sA = pane.querySelector("#dm-cap-setA"); if (sA) sA.addEventListener("click", function() { URStore.set(NS, "slotA", api.getPattern()); sA.textContent = "A \u2713"; setTimeout(function() { sA.textContent = "Set A"; }, 900); });
    var sB = pane.querySelector("#dm-cap-setB"); if (sB) sB.addEventListener("click", function() { URStore.set(NS, "slotB", api.getPattern()); sB.textContent = "B \u2713"; setTimeout(function() { sB.textContent = "Set B"; }, 900); });
    var abState = "A", fb = pane.querySelector("#dm-cap-flip");
    if (fb) fb.addEventListener("click", function() { abState = abState === "A" ? "B" : "A"; var v = URStore.get(NS, "slot" + abState); if (v) { api.loadPattern(v); fb.textContent = "\u21C6 " + abState; } });
    var cp = pane.querySelector("#dm-cap-copy"); if (cp) cp.addEventListener("click", function() { try { navigator.clipboard.writeText(JSON.stringify(api.getPattern())); cp.textContent = "Copied"; setTimeout(function() { cp.textContent = "Copy"; }, 900); } catch(e){} });
    var dlb = pane.querySelector("#dm-cap-dl"); if (dlb) dlb.addEventListener("click", dlPattern);
    var psb = pane.querySelector("#dm-cap-paste"); if (psb) psb.addEventListener("click", function() { fileIn.click(); });
    if (fileIn) fileIn.addEventListener("change", function(e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function() { try { api.loadPattern(JSON.parse(r.result)); } catch(err){ console.error("[DrumMachine] load failed", err); } };
      r.readAsText(f); fileIn.value = "";
    });

    // per-row drawer controls
    KIT.forEach(function(v) {
      v.params.forEach(function(pr) {
        if (pr.k === "level" || pr.k === "decay") {
          bindRange(pane, "dm-" + v.name + "-" + pr.k, function(val) { params[v.name][pr.k] = val; }, pr.dec, pr.unit);
        }
      });
    });
    pane.querySelectorAll(".dm-knob").forEach(wireKnob);

    // keyboard
    var keyMap = {}; KIT.forEach(function(v) { keyMap[v.key] = v.name; });
    document.addEventListener("keydown", function(e) {
      if (e.repeat) return;
      var tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (e.code === "Space") { e.preventDefault(); playBtn.click(); return; }
      var name = keyMap[e.key.toLowerCase()];
      if (name) { trigger(name); }
    });

    requestAnimationFrame(draw);
  }

  function bindRange(pane, id, cb, dec, unit) {
    var el = pane.querySelector("#" + id), out = pane.querySelector("#" + id + "v");
    if (!el) return;
    el.addEventListener("input", function(e) {
      var v = Number(e.target.value);
      if (out) out.textContent = ((dec != null) ? v.toFixed(dec) : v) + (unit || "");
      cb(v);
    });
  }

  // knob drag guide
  var _guide = null, _engaged = false, GLEN = 110;
  function guideEl() {
    if (_guide) return _guide;
    _guide = document.createElement("div"); _guide.className = "dm-guide";
    _guide.innerHTML = '<div class="gl"></div><div class="gt"></div><div class="ga gau">&#x25B2;</div><div class="ga gad">&#x25BC;</div><div class="gb"></div>';
    document.body.appendChild(_guide);
    return _guide;
  }
  function showGuide(ox, oy, color) {
    var g = guideEl(); g.style.setProperty("--gc", color);
    var gl = g.querySelector(".gl"), gt = g.querySelector(".gt"), au = g.querySelector(".gau"), ad = g.querySelector(".gad");
    gl.style.left = ox + "px"; gl.style.top = (oy - GLEN) + "px"; gl.style.height = (2 * GLEN) + "px";
    gt.style.left = ox + "px"; gt.style.top = oy + "px";
    au.style.left = ox + "px"; au.style.top = (oy - GLEN - 10) + "px";
    ad.style.left = ox + "px"; ad.style.top = (oy + GLEN + 10) + "px";
    g.classList.add("show");
  }
  function moveGuide(ox, oy, clientY, text) {
    var g = guideEl(), gb = g.querySelector(".gb");
    var y = Math.max(oy - GLEN, Math.min(oy + GLEN, clientY));
    var right = ox < (window.innerWidth - 130);
    gb.style.left = (ox + (right ? 22 : -22)) + "px";
    gb.style.top = y + "px";
    gb.style.transform = right ? "translate(0,-50%)" : "translate(-100%,-50%)";
    gb.textContent = text;
  }
  function hideGuide() { if (_guide) _guide.classList.remove("show"); }
  document.addEventListener("touchmove", function(e) { if (_engaged) e.preventDefault(); }, { passive: false });

  function wireKnob(el) {
    var min = +el.dataset.min, max = +el.dataset.max, step = +el.dataset.step,
        dec = +el.dataset.dec, unit = el.dataset.unit || "", voice = el.dataset.voice,
        key = el.dataset.key, def = +el.dataset.def;
    var ind = el.querySelector(".dm-knob-ind"), valEl = el.querySelector(".dm-knob-val"), dial = el.querySelector(".dm-knob-dial");
    var grp = el.closest(".dm-rowgroup");
    var gc = grp && grp.classList.contains("cat-perc") ? "#ffb648" : (grp && grp.classList.contains("cat-bass") ? "#ff00ff" : "#00f2ff");
    function clamp(v) { return Math.max(min, Math.min(max, v)); }
    function quant(v) { return clamp(Math.round((v - min) / step) * step + min); }
    function fmt(v) { return (dec ? v.toFixed(dec) : Math.round(v)) + unit; }
    function render(v) {
      var ang = -135 + (max > min ? (v - min) / (max - min) : 0) * 270;
      ind.style.transform = "translate(-50%,-100%) rotate(" + ang + "deg)";
      valEl.textContent = fmt(v); el.setAttribute("aria-valuenow", v);
    }
    function set(v) { v = quant(v); params[voice][key] = v; render(v); return v; }
    set(params[voice][key]);

    var engaged = false, startY = 0, startV = 0, ox = 0, oy = 0, holdT = null, pid = null, downX = 0, downY = 0;
    function engage() {
      engaged = true; _engaged = true; el.classList.add("drag");
      if (dial) dial.style.boxShadow = "inset 0 2px 6px rgba(0,0,0,.6), 0 0 16px " + gc + ", 0 0 30px " + gc;
      try { el.setPointerCapture(pid); } catch(_) {}
      showGuide(ox, oy, gc); moveGuide(ox, oy, oy, fmt(params[voice][key]));
    }
    function endDrag() {
      if (holdT) { clearTimeout(holdT); holdT = null; }
      if (engaged) { engaged = false; _engaged = false; el.classList.remove("drag"); if (dial) dial.style.boxShadow = ""; hideGuide(); }
      try { el.releasePointerCapture(pid); } catch(_) {}
    }
    el.addEventListener("pointerdown", function(e) {
      pid = e.pointerId; startY = e.clientY; startV = params[voice][key];
      ox = e.clientX; oy = e.clientY; downX = e.clientX; downY = e.clientY;
      if (e.pointerType === "mouse" || e.pointerType === "pen") { engage(); e.preventDefault(); }
      else { holdT = setTimeout(engage, 150); }
    });
    el.addEventListener("pointermove", function(e) {
      if (!engaged) {
        if (holdT && (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 8)) { clearTimeout(holdT); holdT = null; }
        return;
      }
      var fine = e.shiftKey ? 0.25 : 1;
      var v = set(startV + (startY - e.clientY) * ((max - min) / 180) * fine);
      moveGuide(ox, oy, e.clientY, fmt(v));
      e.preventDefault();
    });
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
    el.addEventListener("dblclick", function() { set(def); });
    el.addEventListener("keydown", function(e) {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") { set(params[voice][key] + step); e.preventDefault(); }
      else if (e.key === "ArrowDown" || e.key === "ArrowLeft") { set(params[voice][key] - step); e.preventDefault(); }
    });
  }

  function draw() { /* no-op for now, pads/seq update via classes */ }

  var api = {
    trigger: trigger,
    getPattern: function() { return { steps: seq.steps, pattern: seq.pattern, vel: seq.vel, pitch: seq.pitch, rate: seq.rate, swing: seq.swing, mute: seq.mute, solo: seq.solo }; },
    loadPattern: function(p) {
      if (!p) return;
      if (p.steps) seq.steps = p.steps;
      if (p.pattern) seq.pattern = p.pattern;
      if (p.vel) seq.vel = p.vel;
      if (p.pitch) seq.pitch = p.pitch;
      if (p.rate) seq.rate = p.rate;
      if (p.swing != null) seq.swing = p.swing;
      if (p.mute) seq.mute = p.mute;
      if (p.solo) seq.solo = p.solo;
      renderCells(); renderVel(); renderPitch();
    },
    setParam: function(name, key, val) { if (params[name]) params[name][key] = val; }
  };
  window.DrumMachine = api;

  function boot() {
    try { buildUI(); }
    catch (err) {
      console.error("[DrumMachine] boot failed:", err);
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;left:10px;bottom:10px;z-index:99999;background:#1a0008;border:1px solid #ff3b5c;color:#ff9bb0;padding:10px 14px;border-radius:10px;font:700 11px/1.5 ui-monospace,monospace";
      b.textContent = "DRUM MACHINE error: " + (err && err.message ? err.message : err);
      document.body.appendChild(b);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  console.log("%c🥁 DRUM MACHINE — full GM kit (" + KIT.length + " voices). Tap pads to confirm.", "color:#00f2ff;font-weight:bold");
})();
</script>
<!-- ===================== END DRUM MACHINE MODULE ===================== -->
