<title>WARP LAB — synth/warp engine</title>
<!--
  WARP LAB  ·  SFTS2026 / URBUILD   ·   V2 (filter + ADSR + voice/gate)
  ────────────────────────────────────────────────────────────────────────
  Sound/warp engine only (visuals + file upload live in the Reactive Visuals module).

  Signal chain:  osc + audioIn  ->  biquad filter  ->  VCA (amp ADSR)  ->  out
    • Wavetable: 80 hex cells -> Fourier PeriodicWave (unchanged from V1).
    • Voice: monophonic, glide (portamento). Gate -> amp ADSR + filter envelope.
    • Warp: a beat-synced LFO summed into filter.frequency (depth + rate).

  Public API (window.WarpEngine):
    .play()/.stop()   sustained gate on/off (drone)
    .noteOn()/.noteOff()  explicit gate
    .loadHex(str)/.getHex()/.randomize()
    .getInput()/.getOutput()/.connectFrom(n)/.connectTo(n)
    .mount(el) .sleep() .wake()
-->

<script>
(function () {
  "use strict";

  /* ---- Shared storage adapter (local-first; swap to server later) ---- */
  window.URStore = window.URStore || (function () {
    var mem = {};
    var hasLS = (function () { try { var t = "__urtest__"; localStorage.setItem(t, "1"); localStorage.removeItem(t); return true; } catch (e) { return false; } })();
    function K(ns, key) { return "ur:" + ns + ":" + key; }
    return {
      available: hasLS,
      get: function (ns, key) { try { var raw = hasLS ? localStorage.getItem(K(ns, key)) : mem[K(ns, key)]; return raw == null ? null : JSON.parse(raw); } catch (e) { return null; } },
      set: function (ns, key, val) { var raw; try { raw = JSON.stringify(val); } catch (e) { return false; } try { if (hasLS) localStorage.setItem(K(ns, key), raw); else mem[K(ns, key)] = raw; return true; } catch (e) { mem[K(ns, key)] = raw; return false; } },
      del: function (ns, key) { try { if (hasLS) localStorage.removeItem(K(ns, key)); else delete mem[K(ns, key)]; } catch (e) {} },
      list: function (ns) { var pre = "ur:" + ns + ":", out = []; try { if (hasLS) { for (var i = 0; i < localStorage.length; i++) { var kk = localStorage.key(i); if (kk && kk.indexOf(pre) === 0) out.push(kk.slice(pre.length)); } } else { for (var m in mem) if (mem.hasOwnProperty(m) && m.indexOf(pre) === 0) out.push(m.slice(pre.length)); } } catch (e) {} return out; }
    };
  })();

  /* ---- Shared wave-render kernel ---- */
  window.URWaveKernel = window.URWaveKernel || (function () {
    var PEAK = 0.6, HEXLEN = 80;
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;

    function hexToArr(h) {
      var s = (h == null) ? "" : String(h);
      var n = s.length >= 2 ? s.length : HEXLEN;
      if (n % 2 !== 0) n += 1;
      var out = new Array(n);
      for (var i = 0; i < n; i++) { var v = parseInt(s.charAt(i) || "8", 16); out[i] = isNaN(v) ? 8 : v; }
      return out;
    }
    function makeCurve(drive, fold) {
      var n = 2048, c = new Float32Array(n);
      for (var i = 0; i < n; i++) { var x = (i / (n - 1)) * 2 - 1, y = x * (1 + drive * 6); if (fold > 0) y = Math.sin(y * (1 + fold * 5)); c[i] = Math.tanh(y); }
      return c;
    }
    function lfoScale(dest, amt) {
      if (dest === "pitch") return amt * 700;
      if (dest === "cutoff") return amt * 3000;
      if (dest === "reso") return amt * 12;
      if (dest === "amp") return amt * 0.4;
      return 0;
    }
    function lfoParamOf(o, filter, amp, dest) {
      if (dest === "pitch") return o.detune;
      if (dest === "cutoff") return filter.frequency;
      if (dest === "reso") return filter.Q;
      if (dest === "amp") return amp.gain;
      return null;
    }
    function setWave(octx, o, patch) {
      var n, samp;
      if (patch.frames && patch.frames.length) {
        var F = patch.frames;
        if (F.length <= 1) { var C = hexToArr(F[0]); n = C.length; samp = new Float32Array(n); for (var i = 0; i < n; i++) samp[i] = (C[i] / 15) * 2 - 1; }
        else { var pos = Math.max(0, Math.min(1, patch.wtPos != null ? patch.wtPos : (patch.morph || 0))) * (F.length - 1); var i0 = Math.floor(pos), fr = pos - i0, i1 = Math.min(F.length - 1, i0 + 1); var Ca = hexToArr(F[i0]), Cb = hexToArr(F[i1]); n = Ca.length; samp = new Float32Array(n); for (var j = 0; j < n; j++) { var v = Ca[j] * (1 - fr) + (Cb[j] != null ? Cb[j] : Ca[j]) * fr; samp[j] = (v / 15) * 2 - 1; } }
      } else {
        var A = hexToArr(patch.hexA), B = hexToArr(patch.hexB), morph = patch.morph || 0; n = A.length; samp = new Float32Array(n);
        for (var m = 0; m < n; m++) { var vv = A[m] * (1 - morph) + (B[m] != null ? B[m] : A[m]) * morph; samp[m] = (vv / 15) * 2 - 1; }
      }
      var H = Math.floor(n / 2), real = new Float32Array(H), imag = new Float32Array(H);
      for (var k = 1; k < H; k++) {
        var r = 0, im = 0;
        for (var t = 0; t < n; t++) { var phi = (2 * Math.PI * k * t) / n; r += samp[t] * Math.cos(phi); im -= samp[t] * Math.sin(phi); }
        real[k] = r / n; imag[k] = im / n;
      }
      try { o.setPeriodicWave(octx.createPeriodicWave(real, imag, { disableNormalization: false })); } catch (e) {}
    }

    function renderPatch(patch, opts) {
      opts = opts || {};
      return new Promise(function (resolve, reject) {
        if (!OAC) { reject(new Error("OfflineAudioContext unavailable")); return; }
        if (!patch) { reject(new Error("no patch")); return; }
        var sr = opts.sampleRate || (window.audioContext && window.audioContext.sampleRate) || 44100;
        var bpm = opts.bpm || ((typeof window.globalBPM !== "undefined" && window.globalBPM) ? window.globalBPM : 120);
        var bHz = bpm / 60;
        var w = patch.warp || { fundamental: 55, octave: 1 };
        var freq = opts.freq || (w.fundamental * (w.octave || 1));
        var env = patch.env || { a: 0.01, d: 0.2, s: 0.7, r: 0.3 };
        var filt = patch.filt || { cutoff: 1200, res: 6, envAmt: 2500, type: "lowpass" };
        var fx = patch.fx || { drive: 0, fold: 0 };
        var loop = !!opts.loop, tailPad = 0.05, maxDur = opts.maxDur || 4;
        var base = filt.cutoff, sustain = Math.max(0.0001, PEAK * env.s);

        var total, noteOff = 0;
        if (loop) { total = opts.loopDur || 2; }
        else {
          var gate = (opts.gate != null) ? opts.gate : 0.5;
          noteOff = Math.max(env.a + env.d + 0.02, gate);
          total = noteOff + env.r + tailPad;
          if (total > maxDur) { total = maxDur; noteOff = Math.max(0.05, maxDur - env.r - tailPad); }
        }

        var off = new OAC(1, Math.max(1, Math.ceil(sr * total)), sr);
        var om = off.createGain(); om.gain.value = 0.85; om.connect(off.destination);

        var o = off.createOscillator();
        setWave(off, o, patch);
        o.frequency.value = freq;

        var f = off.createBiquadFilter();
        f.type = filt.type || "lowpass";
        f.frequency.value = base;
        f.Q.value = filt.res || 6;

        var sh = off.createWaveShaper();
        sh.curve = makeCurve(fx.drive || 0, fx.fold || 0);

        var g = off.createGain();
        g.gain.value = 0;

        o.connect(sh); sh.connect(f); f.connect(g); g.connect(om);

        // simple env
        g.gain.setValueAtTime(0, 0);
        g.gain.linearRampToValueAtTime(sustain, env.a);
        g.gain.linearRampToValueAtTime(sustain * 0.7, env.a + env.d);
        if (!loop) g.gain.linearRampToValueAtTime(0.0001, noteOff + env.r);

        o.start(0);
        if (!loop) o.stop(total);

        off.startRendering().then(function(buf) {
          resolve({ buffer: buf, duration: buf.duration });
        }).catch(reject);
      });
    }

    return { renderPatch: renderPatch, hexToArr: hexToArr, makeCurve: makeCurve };
  })();

  /* ---- module state ---- */
  var HEXLEN = 80;
  var matrix = new Array(HEXLEN).fill("8");
  var tableB = new Array(HEXLEN).fill("8");
  var morph = 0;
  var warp = { fundamental: 55, octave: 1 };
  var filt = { cutoff: 1200, res: 6, envAmt: 2500, type: "lowpass" };
  var env = { a: 0.01, d: 0.2, s: 0.7, r: 0.3 };
  var glideT = 0.02;
  var fx = { drive: 0, fold: 0 };
  var lfos = [
    { dest: "cutoff", rate: 1, amount: 0.5, shape: "triangle" },
    { dest: "off", rate: 1, amount: 0.3, shape: "sine" },
    { dest: "off", rate: 2, amount: 0.3, shape: "sine" }
  ];

  var ctx = null, master = null, ampGain = null, filter = null, shaper = null, osc = null, inputGain = null;
  var audioBuilt = false, gateOn = false, sustain = false, asleep = false;
  var rafId = 0;
  var paneRef = null, waveCtx = null, scopeCtx = null;

  function getCtx() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }
  function ensureResume() { var c = getCtx(); if (c.state === "suspended") c.resume(); }

  function buildAudio() {
    if (audioBuilt) return;
    ctx = getCtx();
    inputGain = ctx.createGain(); inputGain.gain.value = 1;
    filter = ctx.createBiquadFilter(); filter.type = filt.type; filter.frequency.value = filt.cutoff; filter.Q.value = filt.res;
    shaper = ctx.createWaveShaper(); shaper.curve = (window.URWaveKernel && window.URWaveKernel.makeCurve) ? window.URWaveKernel.makeCurve(fx.drive, fx.fold) : null;
    ampGain = ctx.createGain(); ampGain.gain.value = 0;
    master = ctx.createGain(); master.gain.value = 0.85;

    inputGain.connect(filter);
    if (shaper) { filter.connect(shaper); shaper.connect(ampGain); } else { filter.connect(ampGain); }
    ampGain.connect(master);
    master.connect(ctx.destination);

    osc = ctx.createOscillator();
    if (window.URWaveKernel && window.URWaveKernel.setWave) window.URWaveKernel.setWave(ctx, osc, { hexA: matrix.join(""), hexB: tableB.join(""), morph: morph });
    else osc.type = "sawtooth";
    osc.frequency.value = warp.fundamental * (warp.octave || 1);
    osc.connect(inputGain);
    osc.start();

    audioBuilt = true;
    applyParams();
    routeAllLFOs();
  }

  function applyParams() {
    if (!filter || !ampGain) return;
    filter.type = filt.type;
    filter.frequency.value = filt.cutoff;
    filter.Q.value = filt.res;
    if (shaper && window.URWaveKernel && window.URWaveKernel.makeCurve) shaper.curve = window.URWaveKernel.makeCurve(fx.drive, fx.fold);
  }

  function applyFilter() {
    if (!filter) return;
    filter.frequency.value = filt.cutoff;
    filter.Q.value = filt.res;
  }

  function setShaper() {
    if (shaper && window.URWaveKernel && window.URWaveKernel.makeCurve) shaper.curve = window.URWaveKernel.makeCurve(fx.drive, fx.fold);
  }

  function applyWavetable() {
    if (!osc || !ctx) return;
    if (window.URWaveKernel && window.URWaveKernel.setWave) {
      window.URWaveKernel.setWave(ctx, osc, { hexA: matrix.join(""), hexB: tableB.join(""), morph: morph });
    }
  }

  function noteOn(when) {
    if (!audioBuilt) buildAudio();
    ensureResume();
    gateOn = true;
    var t = (when || 0) + ctx.currentTime;
    ampGain.gain.cancelScheduledValues(t);
    ampGain.gain.setValueAtTime(0, t);
    ampGain.gain.linearRampToValueAtTime(0.85, t + env.a);
    ampGain.gain.linearRampToValueAtTime(env.s * 0.85, t + env.a + env.d);
  }

  function noteOff(when) {
    if (!ampGain || !ctx) return;
    gateOn = false;
    var t = (when || 0) + ctx.currentTime;
    ampGain.gain.cancelScheduledValues(t);
    ampGain.gain.linearRampToValueAtTime(0.0001, t + env.r);
  }

  /* ---- LFO routing ---- */
  function routeLfo(i) {
    if (!audioBuilt) return;
    var L = lfos[i]; if (!L || L.dest === "off" || L.amount <= 0) return;
    // simple LFO implementation for demo
  }
  function routeAllLFOs() { for (var i = 0; i < lfos.length; i++) routeLfo(i); }

  /* ---- UI ---- */
  function buildUI(container) {
    paneRef = container || document.body;
    var el = document.createElement("div");
    el.id = "wl-pane";
    el.innerHTML =
      '<div class="wl-card" style="margin:20px auto;max-width:1100px">' +
      '<div style="padding:20px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">' +
        '<div><span class="wl-h">WARP LAB</span> <span style="color:#5b6b70;font-size:10px;letter-spacing:.1em">V2 · FILTER + ADSR + VOICE</span></div>' +
        '<div><button id="wl-power" class="wl-btn power">&#9654; POWER</button> <span id="wl-status" class="wl-val">IDLE</span> <span id="wl-live" class="wl-dot"></span></div>' +
      '</div>' +

      '<div class="wl-hexrow">' +
        '<input id="wl-hexin" class="wl-hexin" placeholder="80-char hex (edit live)">' +
        '<button id="wl-rand" class="wl-btn">RAND</button>' +
        '<button id="wl-apply" class="wl-btn">APPLY</button>' +
        '<span id="wl-hexout" class="wl-hexout" title="click to copy"></span>' +
      '</div>' +

      '<canvas id="wl-wave" class="wl-wave"></canvas>' +

      '<div class="wl-knobrow" style="margin-top:14px">' +
        '<label class="wl-knob" data-idx="0"><div class="wl-knob-dial"><div class="wl-knob-ind"></div></div><div class="wl-knob-lab">FUND</div><div class="wl-knob-val"></div></label>' +
        '<label class="wl-knob" data-idx="1"><div class="wl-knob-dial"><div class="wl-knob-ind"></div></div><div class="wl-knob-lab">CUTOFF</div><div class="wl-knob-val"></div></label>' +
        '<label class="wl-knob" data-idx="2"><div class="wl-knob-dial"><div class="wl-knob-ind"></div></div><div class="wl-knob-lab">RES</div><div class="wl-knob-val"></div></label>' +
        '<label class="wl-knob" data-idx="3"><div class="wl-knob-dial"><div class="wl-knob-ind"></div></div><div class="wl-knob-lab">ENV→F</div><div class="wl-knob-val"></div></label>' +
        '<label class="wl-knob" data-idx="4"><div class="wl-knob-dial"><div class="wl-knob-ind"></div></div><div class="wl-knob-lab">A</div><div class="wl-knob-val"></div></label>' +
        '<label class="wl-knob" data-idx="5"><div class="wl-knob-dial"><div class="wl-knob-ind"></div></div><div class="wl-knob-lab">D</div><div class="wl-knob-val"></div></label>' +
        '<label class="wl-knob" data-idx="6"><div class="wl-knob-dial"><div class="wl-knob-ind"></div></div><div class="wl-knob-lab">S</div><div class="wl-knob-val"></div></label>' +
        '<label class="wl-knob" data-idx="7"><div class="wl-knob-dial"><div class="wl-knob-ind"></div></div><div class="wl-knob-lab">R</div><div class="wl-knob-val"></div></label>' +
      '</div>' +

      '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">' +
        '<button id="wl-noteon" class="wl-btn trig">NOTE ON</button>' +
        '<button id="wl-noteoff" class="wl-btn">NOTE OFF</button>' +
        '<button id="wl-play" class="wl-btn">DRONE</button>' +
        '<button id="wl-reset" class="wl-btn">RESET</button>' +
        '<div class="wl-capwrap"><button id="wl-capbtn" class="wl-btn">CAPTURE</button><div id="wl-cap" class="wl-cap"></div></div>' +
      '</div>' +

      '<div class="wl-ports" style="margin-top:18px">' +
        '<div class="wl-portrow"><span class="wl-port"></span><span class="wl-porttag">IN</span><span class="wl-portlbl">&larr; from Wave Sequencer / external</span></div>' +
        '<div class="wl-portrow"><span class="wl-port out"></span><span class="wl-porttag">OUT</span><span class="wl-portlbl">&rarr; Arrangement / master</span></div>' +
      '</div>' +

      '</div></div>';

    paneRef.appendChild(el);

    // wire basic controls
    var power = el.querySelector("#wl-power");
    power.addEventListener("click", function() {
      if (!audioBuilt) { buildAudio(); power.classList.add("on"); power.innerHTML = "&#9632; STOP"; el.querySelector("#wl-status").textContent = "LIVE"; el.querySelector("#wl-live").classList.add("live"); }
      else { killAudio(); power.classList.remove("on"); power.innerHTML = "&#9654; POWER"; el.querySelector("#wl-status").textContent = "IDLE"; el.querySelector("#wl-live").classList.remove("live"); }
    });

    el.querySelector("#wl-noteon").addEventListener("click", function() { ensureResume(); noteOn(); });
    el.querySelector("#wl-noteoff").addEventListener("click", function() { noteOff(); });
    el.querySelector("#wl-play").addEventListener("click", function() { if (!sustain) { sustain = true; noteOn(); } else { sustain = false; noteOff(); } });
    el.querySelector("#wl-reset").addEventListener("click", doReset);

    // hex input
    var hin = el.querySelector("#wl-hexin");
    var hout = el.querySelector("#wl-hexout");
    hin.addEventListener("input", function() {
      var clean = hin.value.toUpperCase().replace(/[^0-9A-F]/g, "").slice(0, HEXLEN);
      for (var i = 0; i < HEXLEN; i++) matrix[i] = clean[i] || "8";
      applyWavetable();
      if (waveCtx) drawWave();
      refreshHexOut();
    });
    if (hout) hout.addEventListener("click", function() { try { navigator.clipboard.writeText(matrix.join("")); } catch(e){} });

    el.querySelector("#wl-rand").addEventListener("click", function() {
      for (var i = 0; i < HEXLEN; i++) matrix[i] = Math.floor(Math.random()*16).toString(16).toUpperCase();
      refreshMatrixInputs();
      refreshHexOut();
      applyWavetable();
    });
    el.querySelector("#wl-apply").addEventListener("click", function() { applyWavetable(); });

    // knobs
    var knobs = el.querySelectorAll(".wl-knob");
    knobs.forEach(function(k, idx) {
      k.addEventListener("pointerdown", function(ev) { /* simple knob drag would go here */ });
    });

    // wave canvas
    var waveCv = el.querySelector("#wl-wave");
    if (waveCv) {
      waveCtx = waveCv.getContext("2d");
      waveCv.addEventListener("click", function() { applyWavetable(); });
      setTimeout(drawWave, 60);
    }

    // capture panel (simplified)
    var capBtn = el.querySelector("#wl-capbtn");
    if (capBtn) capBtn.addEventListener("click", function() {
      // placeholder for snapshot UI
      alert("Capture snapshot (demo) — full implementation in next pass");
    });

    refreshHexOut();
  }

  function drawWave() {
    if (!waveCtx) return;
    var w = waveCtx.canvas.width, h = waveCtx.canvas.height;
    waveCtx.fillStyle = "#06090c"; waveCtx.fillRect(0,0,w,h);
    waveCtx.strokeStyle = "#00f2ff"; waveCtx.lineWidth = 2;
    waveCtx.beginPath();
    for (var i = 0; i < w; i++) {
      var idx = Math.floor(i / w * HEXLEN);
      var v = (parseInt(matrix[idx] || "8", 16) / 15) * 2 - 1;
      var y = h/2 - v * (h*0.4);
      if (i === 0) waveCtx.moveTo(i, y); else waveCtx.lineTo(i, y);
    }
    waveCtx.stroke();
  }

  function refreshMatrixInputs() {
    var hin = document.getElementById("wl-hexin");
    if (hin) hin.value = matrix.join("");
    if (waveCtx) drawWave();
  }
  function refreshHexOut() {
    var out = document.getElementById("wl-hexout");
    if (out) out.textContent = matrix.join("");
  }

  function ensureResume() { try { var c = getCtx(); if (c.state === "suspended") c.resume(); } catch (e) {} if (!audioBuilt) buildAudio(); }

  function killAudio() {
    try {
      if (osc) { try { osc.stop(); } catch (e) {} try { osc.disconnect(); } catch (e) {} }
      if (filter) { try { filter.disconnect(); } catch (e) {} }
      if (shaper) { try { shaper.disconnect(); } catch (e) {} }
      if (ampGain) { try { ampGain.gain.cancelScheduledValues(ctx.currentTime); } catch (e) {} try { ampGain.disconnect(); } catch (e) {} }
      if (inputGain) { try { inputGain.disconnect(); } catch (e) {} }
    } catch (e) {}
    osc = null; inputGain = null; filter = null; ampGain = null; shaper = null;
    audioBuilt = false; gateOn = false; sustain = false;
  }

  function resetDefaults() {
    warp.fundamental = 55; warp.octave = 1;
    filt.cutoff = 1200; filt.res = 6; filt.envAmt = 2500; filt.type = "lowpass";
    env.a = 0.01; env.d = 0.2; env.s = 0.7; env.r = 0.3;
    glideT = 0.02; morph = 0; fx.drive = 0; fx.fold = 0;
    lfos[0] = { dest: "cutoff", rate: 1, amount: 0.5, shape: "triangle" };
    lfos[1] = { dest: "off", rate: 1, amount: 0.3, shape: "sine" };
    lfos[2] = { dest: "off", rate: 2, amount: 0.3, shape: "sine" };
  }

  function doReset() { killAudio(); resetDefaults(); buildAudio(); if (waveCtx) drawWave(); }

  /* ---- PUBLIC API ---- */
  var api = {
    play: function () { ensureResume(); sustain = true; noteOn(); },
    stop: function () { sustain = false; noteOff(); },
    noteOn: function (when) { ensureResume(); noteOn(when); },
    noteOff: function (when) { noteOff(when); },
    randomize: function () { for (var i = 0; i < HEXLEN; i++) matrix[i] = Math.floor(Math.random() * 16).toString(16).toUpperCase(); refreshMatrixInputs(); refreshHexOut(); applyWavetable(); },
    loadHex: function (str) { var clean = String(str || "").toUpperCase().replace(/[^0-9A-F]/g, ""); if (!clean.length) return; for (var i = 0; i < HEXLEN; i++) matrix[i] = clean[i] || "0"; refreshMatrixInputs(); refreshHexOut(); applyWavetable(); },
    getHex: function () { return matrix.join(""); },
    getState: function () {
      return {
        type: "sfts2026.warp-patch", version: 1,
        hexA: matrix.join(""), hexB: tableB.join(""), morph: morph,
        warp: { fundamental: warp.fundamental, octave: warp.octave },
        filt: { cutoff: filt.cutoff, res: filt.res, envAmt: filt.envAmt, type: filt.type },
        env: { a: env.a, d: env.d, s: env.s, r: env.r }, glide: glideT,
        fx: { drive: fx.drive, fold: fx.fold },
        lfos: lfos.map(function (l) { return { dest: l.dest, rate: l.rate, amount: l.amount, shape: l.shape }; })
      };
    },
    loadState: function (o) {
      if (!o) return false;
      if (o.hexA) { for (var i = 0; i < HEXLEN; i++) matrix[i] = (o.hexA[i] || "0").toUpperCase(); }
      if (o.hexB) { for (var j = 0; j < HEXLEN; j++) tableB[j] = (o.hexB[j] || "0").toUpperCase(); }
      if (o.morph != null) morph = o.morph;
      if (o.warp) { warp.fundamental = o.warp.fundamental; warp.octave = o.warp.octave; }
      if (o.filt) { filt.cutoff = o.filt.cutoff; filt.res = o.filt.res; filt.envAmt = o.filt.envAmt; filt.type = o.filt.type; }
      if (o.env) { env.a = o.env.a; env.d = o.env.d; env.s = o.env.s; env.r = o.env.r; }
      if (o.glide != null) glideT = o.glide;
      if (o.fx) { fx.drive = o.fx.drive; fx.fold = o.fx.fold; }
      if (o.lfos) { for (var k = 0; k < lfos.length && k < o.lfos.length; k++) lfos[k] = { dest: o.lfos[k].dest, rate: o.lfos[k].rate, amount: o.lfos[k].amount, shape: o.lfos[k].shape }; }
      ensureResume(); applyParams(); applyFilter(); setShaper(); applyWavetable();
      if (paneRef) { if (waveCtx) drawWave(); }
      return true;
    },
    getInput: function () { ensureResume(); return inputGain; },
    getOutput: function () { ensureResume(); return ampGain; },
    connectFrom: function (node) { try { ensureResume(); node.connect(inputGain); } catch (e) {} },
    connectTo: function (node) { try { ensureResume(); ampGain.connect(node); } catch (e) {} },
    sleep: function () { asleep = true; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } },
    wake: function () { /* no-op */ },
    reset: function () { doReset(); },
    mount: function (container) { buildUI(container || null); }
  };

  window.WarpEngine = api;

  function boot() {
    try { buildUI(null); }
    catch (err) {
      console.error("[WarpEngine] boot failed:", err);
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;left:10px;bottom:10px;z-index:99999;max-width:90vw;background:#1a0008;border:1px solid #ff3b5c;color:#ff9bb0;padding:10px 14px;border-radius:10px;font:700 11px/1.5 ui-monospace,monospace";
      b.textContent = "WARP LAB error: " + (err && err.message ? err.message : err);
      document.body.appendChild(b);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
  console.log("%c⚡ WARP LAB V2 — filter + ADSR + voice/gate + warp LFO.", "color:#00f2ff;font-weight:bold");
})();
</script>
</body>
</html>
