  function isBlack(m) { var k = ((m % 12) + 12) % 12; return (k === 1 || k === 3 || k === 6 || k === 8 || k === 10); }

      var x = e.clientX - rect.left, y = e.clientY - rect.top;
      var beat = x / pxPerBeat;
      var pitch = HIGH - Math.floor(y / (rowH * zoom));
      // find note under cursor
      var hit = roll.notes.find(function(n) {
        return pitch === n.pitch && beat >= n.start && beat <= n.start + n.len;
      });
      if (hit) {
        selId = hit.id;
        if (e.detail === 2) { removeNote(hit.id); return; }
        dragging = true;
        dragId = hit.id;
        dragStartX = x;
        dragStartBeat = hit.start;
      } else {
        // draw new
        var n = addNote(pitch, Math.round(beat * 4) / 4, 0.5);
        selId = n.id;
        dragging = true;
        dragId = n.id;
        dragStartX = x;
        dragStartBeat = n.start;
      }
      redraw();
    });
    cv.addEventListener("pointermove", function(e) {
      if (!dragging || !dragId) return;
      var rect = cv.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var db = (x - dragStartX) / pxPerBeat;
      var n = roll.notes.find(function(nn) { return nn.id === dragId; });
      if (n) {
        n.start = Math.max(0, dragStartBeat + db);
        redraw();
      }
    });
    cv.addEventListener("pointerup", function() {
      if (dragging) { persist(); }
      dragging = false; dragId = null;
    });
    cv.addEventListener("pointercancel", function() { dragging = false; dragId = null; });
  }

  /* ---------------- UI ---------------- */
  function refreshControls() {
    if (!paneRef) return;
    paneRef.querySelector("#pr-bpm").value = roll.bpm;
    paneRef.querySelector("#pr-loop").classList.toggle("on", roll.loop);
    paneRef.querySelector("#pr-bars").value = Math.floor(roll.lengthBeats / 4);
    paneRef.querySelector("#pr-snap").value = roll.snap;
  }

  function paneHTML() {
    return '' +
    '<div class="pr-card">' +
    '<div class="pr-title">PIANO ROLL <small>live wavetable voice + arrangement bridge</small></div>' +
    '<div class="pr-row">' +
      '<button class="pr-btn" id="pr-play">PLAY</button>' +
      '<button class="pr-btn" id="pr-stop">STOP</button>' +
      '<span class="pr-label">BPM</span><input class="pr-num" id="pr-bpm" type="number" value="120">' +
      '<button class="pr-btn" id="pr-loop">LOOP</button>' +
      '<button class="pr-btn" id="pr-flow">FLOW</button>' +
      '<span class="pr-label">BARS</span><select class="pr-sel" id="pr-bars"><option value="1">1</option><option value="2">2</option><option value="4" selected>4</option><option value="8">8</option></select>' +
      '<span class="pr-label">SNAP</span><select class="pr-sel" id="pr-snap"><option value="0.0625">1/16</option><option value="0.125">1/8</option><option value="0.25" selected>1/4</option><option value="0.5">1/2</option></select>' +
    '</div>' +
    '<div class="pr-row">' +
      '<button class="pr-btn" id="pr-soundbtn">SOUND &#9662;</button>' +
      '<button class="pr-btn" id="pr-voicebtn">VOICE</button>' +
      '<div class="pr-capwrap"><div id="pr-voice" class="pr-cap"></div></div>' +
      '<button class="pr-btn" id="pr-delsel">DEL SEL</button>' +
      '<button class="pr-btn" id="pr-zoomin">ZOOM +</button>' +
      '<button class="pr-btn" id="pr-zoomout">ZOOM -</button>' +
      '<button class="pr-btn" id="pr-erase">ERASE</button>' +
      '<button class="pr-btn" id="pr-chord">CHORD: OFF</button>' +
      '<button class="pr-btn" id="pr-clear">CLEAR</button>' +
      '<button class="pr-btn" id="pr-copy">COPY</button>' +
      '<button class="pr-btn" id="pr-dl">DOWNLOAD</button>' +
      '<button class="pr-btn" id="pr-loadbtn">LOAD</button>' +
      '<input type="file" id="pr-file" accept=".json,.sfts2026" style="display:none">' +
    '</div>' +
    '<div class="pr-synth" id="pr-synth">' +
      '<div class="pr-synthhead"><span>SOUND DESIGN &middot; <b id="ps-name">Default</b></span><button class="pr-btn" id="ps-reset">RESET VOICE</button></div>' +
      '<div class="pr-sgrid">' +
        '<div class="pr-sgroup">OSCILLATOR / PITCH</div>' +
        psCtl("ps-morph", "MORPH A&rarr;B", 'min="0" max="1" step="0.01"') +
        psSel("ps-oct", "OCTAVE", '<option value="0.25">-2 oct</option><option value="0.5">-1 oct</option><option value="1">0</option><option value="2">+1 oct</option><option value="4">+2 oct</option>') +
        '<div class="pr-sgroup">FILTER</div>' +
        psSel("ps-ftype", "TYPE", '<option value="lowpass">Low-pass</option><option value="highpass">High-pass</option><option value="bandpass">Band-pass</option>') +
        psCtl("ps-cut", "CUTOFF", 'min="0" max="1000" step="1"') +
        psCtl("ps-res", "RESONANCE", 'min="0" max="20" step="0.5"') +
        psCtl("ps-env", "ENV &rarr; CUTOFF", 'min="0" max="6000" step="50"') +
        '<div class="pr-sgroup">AMP ENVELOPE</div>' +
        psCtl("ps-a", "ATTACK", 'min="0" max="1.5" step="0.005"') +
        psCtl("ps-d", "DECAY", 'min="0" max="2" step="0.01"') +
        psCtl("ps-s", "SUSTAIN", 'min="0" max="1" step="0.01"') +
        psCtl("ps-r", "RELEASE", 'min="0" max="3" step="0.01"') +
        '<div class="pr-sgroup">SHAPE</div>' +
        psCtl("ps-drive", "DRIVE", 'min="0" max="1" step="0.01"') +
        psCtl("ps-fold", "WAVEFOLD", 'min="0" max="1" step="0.01"') +
      '</div>' +
    '</div>' +
    '<div class="pr-scroll"><canvas class="pr-canvas" id="pr-canvas"></canvas></div>' +
    '<div class="pr-ports">' +
      '<div class="pr-caph">NODE CONNECTIONS &middot; matrix <span style="opacity:.5">wired at the hub</span></div>' +
      '<div class="pr-portrow"><span class="pr-port inp"></span><span class="pr-porttag">IN &middot; VOICE</span><span class="pr-portlbl">&larr; Warp Lab / Wave Sequencer patch</span></div>' +
      '<div class="pr-portrow"><span class="pr-port"></span><span class="pr-porttag">OUT &middot; AUDIO</span><span class="pr-portlbl">&rarr; Arrangement / Reactive Visuals (baked)</span></div>' +
      '<div class="pr-portrow"><span class="pr-port"></span><span class="pr-porttag">OUT &middot; NOTES</span><span class="pr-portlbl">&rarr; Arrangement / drive other modules</span></div>' +
      '<div class="pr-portrow"><span class="pr-port future"></span><span class="pr-porttag">IN &middot; MIDI</span><span class="pr-portlbl" style="opacity:.5">external MIDI / host (coming)</span></div>' +
    '</div>' +
    '<div class="pr-note">Drag on empty grid to draw a note (drag sets length). Drag a note body to move, drag its right edge to resize. Double-click or right-click a note to delete. Load any Warp / Wave Sequencer sound as the voice, or use the built-in default. Notes play the live wavetable voice; freezing to a buffer for the Arrangement comes with that integration.</div>' +
    '</div>';
  }

  function psCtl(id, label, attrs) {
    return '<div class="pr-ctl"><label>' + label + ' <span class="v" id="' + id + 'v">0</span></label><input type="range" id="' + id + '" ' + attrs + '></div>';
  }
  function psSel(id, label, opts) {
    return '<div class="pr-ctl"><label>' + label + '</label><select id="' + id + '">' + opts + '</select></div>';
  }

  function wireUI(pane) {
    paneRef = pane; cv = pane.querySelector("#pr-canvas"); cctx = cv.getContext("2d");
    refreshControls(); sizeCanvas(); redraw(); wireCanvas(); wireSynth(pane);
    pane.querySelector("#pr-soundbtn").addEventListener("click", function (e) { var sp = pane.querySelector("#pr-synth"); var open = sp.classList.toggle("open"); e.target.innerHTML = "SOUND " + (open ? "&#9652;" : "&#9662;"); if (open) refreshSynthPanel(); });
    pane.querySelector("#pr-play").addEventListener("click", startPlay);
    pane.querySelector("#pr-stop").addEventListener("click", stopPlay);
    pane.querySelector("#pr-bpm").addEventListener("change", function (e) { var v = parseFloat(e.target.value); if (v > 0) { roll.bpm = v; persist(); } });
    pane.querySelector("#pr-loop").addEventListener("click", function (e) { roll.loop = !roll.loop; e.target.classList.toggle("on", roll.loop); persist(); });
    pane.querySelector("#pr-flow").addEventListener("click", function (e) { scrollPlay = !scrollPlay; e.target.classList.toggle("on", scrollPlay); sizeCanvas(); var cc = cv && cv.parentElement; if (cc && !scrollPlay && !playing) cc.scrollLeft = 0; redraw(); });
    pane.querySelector("#pr-bars").addEventListener("change", function (e) { roll.lengthBeats = (parseInt(e.target.value, 10) || 4) * 4; sizeCanvas(); redraw(); persist(); });
    pane.querySelector("#pr-snap").addEventListener("change", function (e) { roll.snap = parseFloat(e.target.value) || 0.25; redraw(); persist(); });
    var vb = pane.querySelector("#pr-voicebtn"), vp = pane.querySelector("#pr-voice");
    vb.addEventListener("click", function (e) { e.stopPropagation(); var open = vp.classList.toggle("open"); if (open) buildVoiceList(); });
    document.addEventListener("click", function (e) { if (vp.classList.contains("open") && !vp.contains(e.target) && !vb.contains(e.target)) vp.classList.remove("open"); });
    pane.querySelector("#pr-delsel").addEventListener("click", function () { if (selId) removeNote(selId); });
    pane.querySelector("#pr-clear").addEventListener("click", function () { stopPlay(); roll.notes = []; selId = null; persist(); redraw(); });
    pane.querySelector("#pr-copy").addEventListener("click", function (e) { try { navigator.clipboard.writeText(JSON.stringify(getState())); e.target.textContent = "COPIED"; setTimeout(function () { e.target.textContent = "COPY"; }, 900); } catch (er) {} });
    pane.querySelector("#pr-dl").addEventListener("click", function () { var blob = new Blob([JSON.stringify(getState(), null, 2)], { type: "application/json" }); var url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = "piano-roll.sfts2026.json"; a.click(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000); });
    var fileIn = pane.querySelector("#pr-file");
    pane.querySelector("#pr-loadbtn").addEventListener("click", function () { fileIn.click(); });
    fileIn.addEventListener("change", function (e) { var f = e.target.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { try { loadState(JSON.parse(r.result)); } catch (err) { showErr("Load failed: " + err.message); } }; r.readAsText(f); fileIn.value = ""; });
    pane.querySelector("#pr-zoomin").addEventListener("click", function () { zoom = Math.min(2.5, zoom * 1.25); sizeCanvas(); redraw(); });
    pane.querySelector("#pr-zoomout").addEventListener("click", function () { zoom = Math.max(0.6, zoom / 1.25); sizeCanvas(); redraw(); });
    pane.querySelector("#pr-erase").addEventListener("click", function (e) { eraseMode = !eraseMode; e.target.classList.toggle("on", eraseMode); });
    pane.querySelector("#pr-chord").addEventListener("click", function (e) { chordMode = chordMode === "off" ? "maj" : chordMode === "maj" ? "min" : "off"; e.target.textContent = "CHORD: " + chordMode.toUpperCase(); e.target.classList.toggle("on", chordMode !== "off"); });
    var prCont = cv && cv.parentElement; if (prCont) prCont.addEventListener("scroll", function () { if (!playing) redraw(); });
    window.addEventListener("resize", function () { sizeCanvas(); if (!playing) redraw(); });
  }

  /* ---------------- API + BOOT ---------------- */
  var api = {
    mount: function (el) { if (!el) return; el.innerHTML = paneHTML(); wireUI(el); restore(); },
    play: startPlay, stop: stopPlay,
    getState: getState, loadState: loadState,
    setVoice: function (patch, name) { chooseVoice(patch || null, name || (patch ? "patch" : "Default")); },
    getContext: function () { ensureResume(); return ctx; },
    getOutput: function () { ensureResume(); return master; },
    getInput: function () { return null; },
    sleep: function () { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } },
    wake: function () { if (playing && !rafId) rafId = requestAnimationFrame(drawLoop); }
  };
  window.PianoRoll = api;

  function boot() {
    try {
      var aBtn = document.querySelector(".tab-btn");
      var aPane = document.querySelector(".tab-pane") || document.querySelector(".tab-content");
      var hosted = !!(aBtn && aPane);
      if (hosted) {
        var paneClass = aPane.classList.contains("tab-content") ? "tab-content" : "tab-pane";
        var navEl = aBtn.parentElement, paneHost = aPane.parentElement;
        var btn = document.createElement("button"); btn.className = "tab-btn"; btn.textContent = "Piano Roll";
        var pane = document.createElement("div"); pane.className = paneClass; pane.id = "pr-host"; pane.style.display = "none";
        var inner = document.createElement("div"); inner.id = "pr-pane"; pane.appendChild(inner);
        navEl.appendChild(btn); paneHost.appendChild(pane);
        btn.addEventListener("click", function () { if (typeof switchTab === "function") { try { switchTab(); } catch (e) {} } });
        api.mount(inner);
      } else {
        var host = document.createElement("div"); host.id = "pr-pane"; document.body.appendChild(host);
        api.mount(host);
      }
    } catch (e) {
      var bar = document.createElement("div");
      bar.style.cssText = "margin:10px;padding:10px 12px;border-radius:10px;background:#2a0d11;border:1px solid #ff5b6c;color:#ffb3bb;font:12px ui-monospace,monospace;white-space:pre-wrap";
      bar.textContent = "[Piano Roll] boot error: " + (e && e.message ? e.message : e);
      document.body.appendChild(bar);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
