<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ur.space · DAW Node Matrix</title>
<link rel="stylesheet" href="css/matrix.css">
</head>
<body>

<header>
  <div class="brand">ur.space <span class="ver">DAW</span></div>

  <button id="hubBtn" class="hub">HUB</button>

  <div class="spacer"></div>

  <button id="modBtn" class="btn">MOD</button>
  <button id="wireBtn" class="btn">WIRE</button>
  <button id="clearBtn" class="btn">CLEAR</button>

  <div class="spacer"></div>

  <button id="zoomOut" class="btn">−</button>
  <button id="zoomFit" class="btn">FIT</button>
  <button id="zoomIn" class="btn">+</button>

  <div class="spacer"></div>

  <div id="busStat" class="stat">0 MSG</div>
  <button id="drawerHead" class="btn">LOG</button>
</header>

<div id="field">
  <canvas id="wires"></canvas>
  <div id="world"></div>
</div>

<div id="modmenu" class="menu">
  <div id="modlist"></div>
</div>

<div id="nodemenu" class="menu nodemenu"></div>

<div id="drawer">
  <div id="log"></div>
</div>

<div id="toast"></div>

<script src="js/core.js"></script>
<script src="js/nodes.js"></script>
<script src="js/modules.js"></script>
<script src="js/input.js"></script>

<script>
// Thin loader bootstrap — runs after all external modules are loaded
(function() {
  'use strict';

  // Initial built-in nodes (PULSE + BUS MONITOR) if nothing is placed yet
  function ensureBuiltins() {
    if (placed.size === 0) {
      var pulse = catalogById('pulse');
      var busmon = catalogById('busmon');
      if (pulse && !placed.has('pulse')) {
        pulse.x = 120; pulse.y = 140;
        placed.add('pulse');
        buildNodeEl(pulse);
        probeNode(pulse);
      }
      if (busmon && !placed.has('busmon')) {
        busmon.x = 420; busmon.y = 220;
        placed.add('busmon');
        buildNodeEl(busmon);
        probeNode(busmon);
      }
      persist();
      announceRoster();
    }
  }

  // Main initialization
  function init() {
    // Build the MOD menu
    if (typeof buildMenu === 'function') buildMenu();

    // Initial layout + transform
    if (typeof layoutWorld === 'function') layoutWorld();

    // Ensure the two built-in test nodes exist on first load
    ensureBuiltins();

    // Final render pass
    if (typeof drawWires === 'function') drawWires();
    if (typeof renderBadges === 'function') renderBadges();
    if (typeof applyTransform === 'function') applyTransform();

    // Optional: auto-open a helpful hint on first visit
    setTimeout(function() {
      var hasVisited = localStorage.getItem('ur.daw.visited');
      if (!hasVisited && placed.size <= 2) {
        if (typeof toast === 'function') toast('Tap MOD to add modules • Drag nodes • Draw wires');
        localStorage.setItem('ur.daw.visited', '1');
      }
    }, 1200);

    console.log('%c[DAW] Thin multi-file loader initialized — all modules externalized.', 'color:#4fd8ff');
  }

  // Boot when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
